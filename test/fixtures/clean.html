<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clean page</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      .panel {
        text-align: center;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      @media (min-width: 768px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container bar">
        <a class="logo" href="/">
          <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
            <circle cx="14" cy="14" r="12" fill="#1a1a1a" />
          </svg>
          Acme
        </a>
        <nav><a href="#work">Work</a> <a href="#about">About</a></nav>
      </div>
    </header>
    <main>
      <section class="container">
        <h1>Layouts that hold</h1>
        <p>Every panel, card and image lines up at every width.</p>
        <a class="btn" href="#start">
          Get started
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 8h12M9 3l5 5-5 5" stroke="#fff" fill="none" stroke-width="2" />
          </svg>
        </a>
      </section>
      <section class="container">
        <div class="panel">
          <h2>One inset, one radius</h2>
          <p>Panels share the same left and right edge and the same corner radius.</p>
        </div>
      </section>
      <section class="container">
        <h2>Cards</h2>
        <div class="grid">
          <div class="card">One</div>
          <div class="card">Two</div>
          <div class="card">Three</div>
          <div class="card">Four</div>
          <div class="card">Five</div>
          <div class="card">Six</div>
        </div>
      </section>
      <section class="container">
        <img class="photo" src="photo-a.png" width="2400" height="800" alt="Plain colour field" />
        <img class="photo" src="photo-b.png" width="2400" height="800" alt="Another colour field" />
      </section>
    </main>
    <footer class="container"><p>Footer text</p></footer>
  </body>
</html>
